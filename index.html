    <script>
      (function() {
        // Provide both getter and setter on window.fetch so browser extensions and interceptors
        // can safely wrap/patch fetch without throwing "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var _rawFetch = window.fetch;
          var _activeFetch = _rawFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _activeFetch;
            },
            set: function(fn) {
              _activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if property is already frozen
        }

        // Catch and isolate uncaught exceptions originating from browser extensions
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && event.reason.stack && event.reason.stack.indexOf('chrome-extension://') !== -1) {
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
          }
        }, true);
      })();
    </script>
